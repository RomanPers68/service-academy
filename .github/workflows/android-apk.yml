# v222 (Доп. 548): APK-пробник Service Academy для Android (TWA, проект — android/). Собирается здесь и выкладывается
# в выпуск android-test: https://github.com/RomanPers68/service-academy/releases/tag/android-test
# Запускается, когда меняется сама оболочка (android/, манифест сайта, значки), и вручную (Actions → android-apk →
# Run workflow). Экраны приложения обновляются с сайта, пересобирать для них не нужно.
name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/manifest.webmanifest"
      - "public/icons/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      TAG: android-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ключ подписи
        run: bash android/key.sh
      - name: Сборка APK
        run: |
          export APK_VERSION_CODE="${{ github.run_number }}" APK_VERSION_NAME="1.0.${{ github.run_number }}"
          gradle -p android --no-daemon --stacktrace assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk service-academy.apk
      - name: Проверка APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging service-academy.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission|launchable)" || true
          CERT=$("$BT/apksigner" verify --print-certs service-academy.apk | grep -m1 "SHA-256 digest" | sed 's/.*: *//' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "подпись APK: $CERT"
          [ "$CERT" = "$APK_FP" ] || { echo "::error::APK подписан не тем ключом: $CERT, а нужен $APK_FP"; exit 1; }
      - name: Выпуск
        run: bash android/release.sh
