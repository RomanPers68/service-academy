<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Service Academy</title>
    <!-- Доп. 173: офлайн и экран «Домой» -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SA" />
    <meta name="theme-color" content="#171208" />
    <!-- Доп. 363: без автоподгонки шрифта iOS — иначе после поворота телефона текст остаётся крупнее -->
    <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
    <!-- v55 (Доп. 368): соединение с сервером открываем заранее, пока грузится приложение, —
         первые запросы после показа уходят без рукопожатия (DNS, TCP, TLS). Адрес — из api/supabase.js -->
    <link rel="preconnect" href="https://gvxhgdynjuaisswplroh.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://gvxhgdynjuaisswplroh.supabase.co">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Telegram-инициализация: развернуть мини-апп на весь экран и отдать
      // вертикальные свайпы контенту. Без expand() на Android жесты таскают
      // шторку самого Telegram вместо скролла — «скролл не работает».
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          tg.expand();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        } catch (e) {}
      })();
    </script>
    <!-- Акцентный шрифт Piazzolla (заголовки и цифры). Загрузка неблокирующая:
         приложение стартует сразу на Georgia, шрифт подъезжает фоном.
         Основной источник jsDelivr, при недоступности — Google Fonts. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdn.jsdelivr.net/npm/@fontsource/piazzolla@5/700.css"
      onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Piazzolla:opsz,wght@8..30,700&display=swap';document.head.appendChild(l)">
    <!-- v59 (Доп. 372): основной шрифт приложения — Georgia. На iPhone и компьютерах она есть, на Android — нет,
         и там подставлялся Noto Serif: приложение выглядело иначе. Эти правила говорят браузеру: есть своя Georgia —
         бери её (local), нет — скачай PT Serif (ParaType, OFL, /assets/fonts) под тем же именем. iPhone не качает
         ничего; Android — только нужные части (кириллица, латиница), шрифт подменяется без мигания (swap). -->
    <style>
      /* знаки вне кириллицы и латиницы (✦, стрелки) — своя Georgia, где она есть; иначе следующий шрифт из списка.
         Эти правила первыми: при совпадении кодов побеждают объявленные ниже, с диапазонами */
      @font-face{font-family:"Georgia";font-style:normal;font-weight:400;src:local("Georgia")}
      @font-face{font-family:"Georgia";font-style:normal;font-weight:700;src:local("Georgia Bold"),local("Georgia-Bold")}
      @font-face{font-family:"Georgia";font-style:normal;font-weight:400;font-display:swap;src:local("Georgia"),url(/assets/fonts/pt-serif-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      @font-face{font-family:"Georgia";font-style:normal;font-weight:400;font-display:swap;src:local("Georgia"),url(/assets/fonts/pt-serif-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:"Georgia";font-style:normal;font-weight:700;font-display:swap;src:local("Georgia Bold"),local("Georgia-Bold"),url(/assets/fonts/pt-serif-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      @font-face{font-family:"Georgia";font-style:normal;font-weight:700;font-display:swap;src:local("Georgia Bold"),local("Georgia-Bold"),url(/assets/fonts/pt-serif-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:"Georgia";font-style:italic;font-weight:400;font-display:swap;src:local("Georgia Italic"),local("Georgia-Italic"),url(/assets/fonts/pt-serif-cyrillic-400-italic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      @font-face{font-family:"Georgia";font-style:italic;font-weight:400;font-display:swap;src:local("Georgia Italic"),local("Georgia-Italic"),url(/assets/fonts/pt-serif-latin-400-italic.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    </style>
  </head>
  <body>
    <!-- Брендовый сплэш: виден с первой миллисекунды, до загрузки JS.
         Тема берётся из localStorage, чтобы не мигать не тем цветом. -->
    <style>
      #sa-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#171208;transition:opacity .35s ease;pointer-events:none}
      #sa-splash.light{background:#EFE6D2}
      #sa-splash .mark{font-family:Georgia,serif;color:#C8A96E;font-size:16px;letter-spacing:7px;animation:saSplashPulse 1.1s ease-in-out infinite}
      #sa-splash.light .mark{color:#8B6A30}
      @keyframes saSplashPulse{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
    <div id="sa-splash"><div class="mark">✦ SA</div></div>
    <script>
      try{if(localStorage.getItem("sa_a11y")==="1")document.getElementById("sa-splash").className="light"}catch(e){}
      /* Диагностика запуска: любая ранняя ошибка записывается, а если за
         8 секунд приложение не поднялось — заставка сама говорит, что
         случилось, вместо вечного мерцания (прод-кейс: Telegram держал
         старый HTML с мёртвыми ссылками на файлы — «вечная загрузка»
         на трёх устройствах без единого сообщения). */
      window.__saErr = "";
      window.addEventListener("error", function(e){
        try{ window.__saErr = String((e && (e.message || (e.error && e.error.message))) || "ошибка загрузки"); }catch(_){}
      }, true);
      setTimeout(function(){
        try{
          var root = document.getElementById("root");
          var sp = document.getElementById("sa-splash");
          if (sp && root && !root.firstChild) {
            var light = sp.className === "light";
            sp.innerHTML = '<div style="max-width:280px;text-align:center;font-family:Georgia,serif;line-height:1.65;color:' + (light ? "#5A431B" : "#C8A96E") + '">' +
              '<div style="font-size:15px;letter-spacing:5px;margin-bottom:14px">✦ SA</div>' +
              '<div style="font-size:14px;font-weight:bold;margin-bottom:8px">Не удалось запустить приложение</div>' +
              '<div style="font-size:12px;opacity:.85">Закрой мини-приложение полностью и открой заново. Если повторится — скажи менеджеру.' +
              (window.__saErr ? '<br><br><span style="font-size:10px;opacity:.7">Техдетали: ' + window.__saErr.slice(0,140) + '</span>' : '') +
              '</div></div>';
          }
        }catch(_){}
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/main.jsx?v=20260610"></script>
  </body>
</html>
