# Дополнение 137: проверки запускаются сами на каждый коммит.
# Результат виден в GitHub: зелёная галочка или красный крестик у коммита.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
