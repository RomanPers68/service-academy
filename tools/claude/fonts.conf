<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Georgia на телефоне; здесь её нет — ближайшая по пропорциям с кириллицей -->
  <alias binding="same"><family>Georgia</family><prefer><family>Lora</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
